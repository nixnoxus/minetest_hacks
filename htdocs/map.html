<body style="
border:0px;
padding:0px;
margin:0px;
width:100%;
height:100%;
position:absolute;
">
<div id="c" style="
border:0px;
padding:0px;
margin: 0px;
position:relative;
width:100%;
height:100%;
overflow:hidden;
">
<div id="hud" class="overlay_hud">
    <span>
    <select id="tool" name="tool">
    <option value="move">move map</option>
    <option value="select">select rect</option>
    </select>
    </span>

    <span>
    <select id="grid" name="grid">
    <option value="0">no grid</option>
    <option value="1">grid 1x1</option>
    <option value="2">grid 2x2</option>
    <option value="4">grid 4x4</option>
    <option value="8">grid 8x8</option>
    <option value="16">grid 16x16</option>
    <option value="32">grid 32x32</option>
    </select>
    </span>

    <span>
    <select id="zoom" name="zoom">
    <option value="0.03125">zoom /32</option>
    <option value="0.0625">zoom /16</option>
    <option value="0.125">zoom /8</option>
    <option value="0.25">zoom /4</option>
    <option value="0.5">zoom /2</option>
    <option value="1">zoom x1</option>
    <option value="2">zoom x2</option>
    <option value="4">zoom x4</option>
    <option value="8">zoom x8</option>
    <option value="16">zoom x16</option>
    <option value="32">zoom x32</option>
    </select>
    </span>

    <span>center
    <input id="center" name="center" type="text" size="8">
    </span>
    <span id="offset"></span>

    <span>
    <select id="poi" name="poi">
    </select>
    </span>
</div>
<canvas id="cMap" style="
border:1px;
padding:0px;
margin: 0px;
/* cursor:pointer; */
/* cursor:crosshair; */
">
</canvas>
<div id="selection" class="selection" hidden></div>
<div id="koord" class="overlay_info"></div>
</div>
</body>
</html>
